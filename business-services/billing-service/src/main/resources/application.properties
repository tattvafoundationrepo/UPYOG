# eMarket FI accounting (GST advance tracking & clearing)
# "Receivable from Mun Mkt" GL for demand-side FI rows. Collection and demand-reversal
# have always posted 431409936; demand creation was left on the superseded 431190300,
# so the two sides could never reconcile in SAP. Set back to 431190300 to restore the
# old behaviour without a deploy.
emarket.fi.receivable.gl=431409936
# The money leg of a collection voucher, split by how the money arrived (BMC, 03-09-2026): cash on
# the bank/interim account, cheque and DD on cheques-in-hand until the instrument clears. Applied at
# POSTING time, so the stored FI row, the CSV and the document SAP receives all carry the same GL.
# The cheques-in-hand leg also carries the cheque number in its SAP Assignment (ZUONR).
# A reversal always reuses the account the original receipt was posted to, so receipts taken before
# this split still reverse cleanly. Set both to the same value to restore the old single-GL shape.
emarket.fi.bank.cash.gl=450100100
emarket.fi.bank.cheque.gl=450210010
# Split a mixed receipt (arrears + advance in one payment) into a regular voucher and an
# advance voucher instead of booking the whole amount to the advance account. The branch fires
# only when one receipt carries BOTH an advance and a regular component, so every pure receipt
# is unaffected. Set to false to restore the single-voucher behaviour without a deploy.
emarket.fi.mixed.receipt.split.enabled=true
# A regular (non-advance) collection on a GST-bearing demand debits Bank for the FULL cash and
# credits the receivable -- no CGST/SGST legs (BMC direction 2026-08-25). The liability was booked
# on the demand; remittance to Government is a separate voucher. Receipts already posted under the
# old net-of-GST shape still reverse with their four legs (posted-document guard). false = old shape.
emarket.fi.regular.collection.gross.bank.enabled=true
# Decide advance-vs-regular from the payment's own rentalAdvancePaid/licenseAdvancePaid rather
# than from an advance carry-forward head left on the licensee's demands. That head stays on the
# ledger after an advance is taken -- at 0.00 once exhausted -- so every later ORDINARY collection
# from a licensee who ever took an advance was booked to 350410215 instead of clearing the
# receivable. An advance taken with nothing due is collected against a zero-value demand carrying
# only that head, and its payment does carry the amount, so it is unaffected either way.
# Off = today's behaviour.
emarket.fi.advance.flow.from.payment.enabled=true
# Post the two-line relief (Dr 350410215 / Cr receivable) for a PRE-EXISTING demand that an
# apportion settles from a licensee's advance. Those demands are routed to DemandRepository.update(),
# which writes no FI, so their receivable stays open although the ledger shows them collected.
# Off until UAT sign-off; off = no new rows and no new code executed.
emarket.fi.advance.settlement.existing.demand.enabled=false
# Post the per-tax-head 4-Series pair on a demand raised against an advance: Dr the head's
# receivable account (431409937..431409977), Cr the head's revenue account, for the amount that
# head settled out of the advance. Purely additive -- 350410215 still takes the full settled
# amount and still closes to nil across an advance cycle.
# ON FOR UAT VERIFICATION -- BMC FINANCE MUST CONFIRM THE CREDIT LEG BEFORE THIS IS TRUE IN
# PRODUCTION. The pair credits the head's revenue GL a SECOND time, on top of the credit the
# voucher already posts, so with it on the ledger recognises the month's rent twice. That is what
# BMC's reference entry shows, but every automated balance assertion passes either way, so no test
# can settle it. Set it back to false, or override it false on the production deploy, until the
# credit leg is confirmed in writing.
# Requires docs/sql/add_gl_series.sql + seed_gl_series_4.sql in emarket-v1, and the emarket-v1
# deploy that stamps advglcode.
# Off = no new PAIR is written. The unwind is deliberately NOT gated: a pair posted while this
# was on is still mirrored when its receipt or demand is later cancelled with it off, which is
# why turning it off is safe rather than a way to strand rows. On a database where it has never
# been on, the unwind query matches nothing and output is byte-identical.
emarket.fi.advance.four.series.enabled=true
# Post the DEBIT legs of a collection voucher at the SAP dimensions of the CFC where the money was
# taken, instead of the market the licensee's stall sits in. The credit legs, the whole demand side
# and the two advance-GST clearing legs (439300200/201) keep the market's dimensions.
# Gates the FORWARD path only: a reversal always reads its dimensions back off the posted document,
# flag or no flag, so a receipt is always given back as it was booked.
# Requires docs/sql/add_cfc_ward_dimension.sql.
# ON FOR UAT VERIFICATION -- BMC MUST CONFIRM THEIR SAP CLIENT ACCEPTS A DOCUMENT WHOSE LEGS CARRY
# TWO DIFFERENT BUSINESS AREAS BEFORE THIS IS TRUE IN PRODUCTION. With document splitting or
# business-area balance sheets active such a document is rejected or auto-split.
# Off = today's behaviour, byte-identical.
emarket.fi.collection.cfc.dimensions.enabled=true
